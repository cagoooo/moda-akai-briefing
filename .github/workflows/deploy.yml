name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site 📦
        run: |
          mkdir _site
          cp -r index.html css js images media _site/
          cp favicon.svg apple-touch-icon.png og-image.jpg _site/
          echo '{"version":"__BUILD_VERSION__"}' > _site/version.json

      - name: Stamp version 🔖
        run: python3 .github/stamp_version.py _site "$(TZ=Asia/Taipei date +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
